

    <script>
        lucide.createIcons();

        Chart.defaults.font.family = "'Space Grotesk', sans-serif";

        // Income Summary Chart (Bar + Line)
        const ctxIncome = document.getElementById('incomeChart').getContext('2d');
        new Chart(ctxIncome, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'],
                datasets: [
                    {
                        type: 'line',
                        label: 'Trend',
                        data: [35, 55, 75, 65, 80, 70, 95, 110],
                        borderColor: '#0055FF',
                        borderWidth: 2,
                        tension: 0.4,
                        pointRadius: 3,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#0055FF'
                    },
                    {
                        type: 'bar',
                        label: 'Baret',
                        data: [30, 70, 110, 55, 105, 130, 140, 100],
                        backgroundColor: '#00a86b',
                        borderRadius: 4,
                        barPercentage: 0.6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#94a3b8' } },
                    y: { grid: { color: 'rgba(0,0,0,0.03)' }, ticks: { font: { size: 10 }, color: '#94a3b8', stepSize: 25 }, max: 150 }
                }
            }
        });

        // Spending Trend Chart (Line with Area)
        const ctxSpending = document.getElementById('spendingChart').getContext('2d');
        
        // Gradient definition
        let gradient = ctxSpending.createLinearGradient(0, 0, 0, 200);
        gradient.addColorStop(0, 'rgba(0, 85, 255, 0.2)');
        gradient.addColorStop(1, 'rgba(0, 85, 255, 0)');

        new Chart(ctxSpending, {
            type: 'line',
            data: {
                labels: ['Jan', 'Uut', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                datasets: [{
                    label: 'Spending',
                    data: [20, 50, 45, 85, 110, 80, 130],
                    borderColor: '#0055FF',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true,
                    backgroundColor: gradient,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#0055FF',
                    pointBorderWidth: 2,
                    pointRadius: 4,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#94a3b8' } },
                    y: { display: false, min: 0, max: 150 } // Oculto como en el diseño
                }
            }
        });
    </script>
</body>
</html>
