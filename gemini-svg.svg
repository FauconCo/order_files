<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <line x1="0" y1="200" x2="1000" y2="200" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1" />
  <line x1="200" y1="0" x2="200" y2="400" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1" />
  <line x1="420" y1="0" x2="420" y2="400" stroke="#FF6B00" stroke-dasharray="5,5" stroke-width="1" />
  
  <circle cx="200" cy="200" r="120" fill="none" stroke="#003B95" stroke-width="3" />
  <path d="M 100 250 L 300 150 M 150 150 Q 200 80 250 150" fill="none" stroke="#003B95" stroke-width="2" stroke-dasharray="6,6" />
  <text x="200" y="210" font-family="monospace" font-size="14" fill="#FF6B00" text-anchor="middle">[Isotipo: Llanta + Camino]</text>
  
  <rect x="420" y="80" width="450" height="70" fill="none" stroke="#003B95" stroke-width="2" />
  <text x="430" y="135" font-family="sans-serif" font-weight="bold" font-size="60" fill="none" stroke="#003B95" stroke-width="2" letter-spacing="2">LLANTERA</text>
  
  <rect x="420" y="160" width="450" height="90" fill="none" stroke="#003B95" stroke-width="2" />
  <text x="430" y="235" font-family="sans-serif" font-weight="900" font-size="80" fill="none" stroke="#003B95" stroke-width="2" letter-spacing="2">PINPON</text>
  
  <rect x="420" y="260" width="500" height="40" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="4,4" />
  <text x="430" y="290" font-family="sans-serif" font-weight="bold" font-size="28" fill="#003B95">distribuidora de llantas</text>
  
  <text x="420" y="70" font-family="monospace" font-size="12" fill="#FF6B00">[Font: Montserrat Bold / H1]</text>
  <text x="420" y="320" font-family="monospace" font-size="12" fill="#FF6B00">[Font: Montserrat SemiBold - Alineación: Izquierda]</text>
</svg>
